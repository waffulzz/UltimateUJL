# Build and test on Windows, Linux and macOS.
#
# The game itself is recompiled from the user's own disc, which CI doesn't have. Instead every job recompiles a
# small synthetic PS-X EXE (tests/smoke/smoke.py) with the real generator, builds all targets against it with the
# real runtime and frontend, then boots that test disc in the headless probe and checks guest RAM and the frame.
# On Linux the OpenGL frontend also runs under Xvfb (Mesa llvmpipe) and its hardware-rendered frame is checked.
# The binaries built here run only the test program; they are not uploaded.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build cmake python3 \
            libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            xvfb mesa-utils libgl1-mesa-dri gdb
      - name: Generate test code
        run: python3 -I tests/smoke/smoke.py gen build/smoke
      - name: Configure
        run: >-
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRECOMP_DIR="$PWD/build/smoke/gen"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/cmake 2>&1 | tee build/build.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|ld: " build/build.log | head -20 | sed 's/^/::error::/' || true
      - name: Smoke test (probe)
        run: python3 -I tests/smoke/smoke.py run build/cmake/ujl_probe build/smoke
      - name: Smoke test (OpenGL frontend)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_DRIVER: x11
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 -I tests/smoke/smoke.py frontend build/cmake/ujl build/smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: |
            build/smoke/*.log
            build/smoke/run/build/shots/
            build/cmake/shots/

  macos:
    name: macOS (Apple clang, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: brew install ninja
      - name: Generate test code
        run: python3 -I tests/smoke/smoke.py gen build/smoke
      - name: Configure
        run: >-
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRECOMP_DIR="$PWD/build/smoke/gen"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/cmake 2>&1 | tee build/build.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|ld: " build/build.log | head -20 | sed 's/^/::error::/' || true
      - name: Smoke test (probe)
        run: python3 -I tests/smoke/smoke.py run build/cmake/ujl_probe build/smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: |
            build/smoke/*.log
            build/smoke/run/build/shots/

  # iOS: compile and link the app bundle (OpenGL ES renderer, touch controller, document picker) against the same
  # test code, for the simulator and for devices. A separate simulator app tests native picker callbacks with
  # synthetic files. The device smoke bundle is ad-hoc signed; Playable builds packages the sideloadable IPA.
  ios:
    name: iOS 27.2 (${{ matrix.sdk }})
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphonesimulator, iphoneos]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: brew install ninja
      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-version)" = 27.2
          echo "::notice title=iOS toolchain::$(xcodebuild -version | tr '\n' ' ') | ${{ matrix.sdk }} $(xcrun --sdk ${{ matrix.sdk }} --show-sdk-version) | deployment target 15.0"
      - name: Generate test code
        run: python3 -I tests/smoke/smoke.py gen build/smoke
      - name: Configure
        run: >-
          cmake -S . -B build/ios -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}27.2 -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DUJL_REPLAY_FILES=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRECOMP_DIR="$PWD/build/smoke/gen"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/ios 2>&1 | tee build/build.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|ld: " build/build.log | head -20 | sed 's/^/::error::/' || true
      - name: Check the bundle
        run: |
          test -x build/ios/UltimateUJL.app/UltimateUJL
          plutil -lint build/ios/UltimateUJL.app/Info.plist
          codesign --verify build/ios/UltimateUJL.app
      - name: Build native picker tests
        if: matrix.sdk == 'iphonesimulator'
        run: |
          set -o pipefail
          cmake --build build/ios --target ujl_ios_picker_test 2>&1 | tee build/picker-build.log
      - name: Report picker compiler errors
        if: failure() && matrix.sdk == 'iphonesimulator'
        run: |
          grep -E "error:|undefined reference|ld: " build/picker-build.log | head -20 | sed 's/^/::error::/' || true
      - name: Run native picker lifecycle tests (iPhone Duo, iOS 27.2)
        if: matrix.sdk == 'iphonesimulator'
        timeout-minutes: 5
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-27-2" in k for x in v if x["name"] == "iPhone Duo"))')
          xcrun simctl boot "$device" || true
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl bootstatus "$device" -b
          bundle=io.github.waffulzz.UltimateUJL.pickertest
          xcrun simctl install "$device" build/ios/UJLPickerTest.app
          xcrun simctl launch "$device" "$bundle"
          data=$(xcrun simctl get_app_container "$device" "$bundle" data)
          result="$data/Documents/picker-test-result.txt"
          for i in $(seq 1 120); do
            if [ -f "$result" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$result" ]; then
            echo '::error::Native picker test did not write a result.'
            xcrun simctl spawn "$device" log show --last 2m --style compact --predicate 'process == "UJLPickerTest"' > build/picker-test.log
            tail -60 build/picker-test.log
            exit 1
          fi
          cat "$result"
          if ! grep -qx PASS "$result"; then
            echo "::error::$(head -1 "$result")"
            exit 1
          fi

  windows:
    name: Windows (clang, MinGW UCRT)
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # CLANG64 is the same toolchain family as llvm-mingw (clang + libc++ + mingw-w64 UCRT) used for releases
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
      - name: Generate test code
        run: python -I tests/smoke/smoke.py gen build/smoke
      - name: Configure
        run: >-
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRECOMP_DIR="$(cygpath -m "$PWD")/build/smoke/gen"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/cmake 2>&1 | tee build/build.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|ld: " build/build.log | head -20 | sed 's/^/::error::/' || true
      - name: Smoke test (probe)
        run: python -I tests/smoke/smoke.py run build/cmake/ujl_probe.exe build/smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: |
            build/smoke/*.log
            build/smoke/run/build/shots/

  python-tools:
    name: Python tools (syntax, CI packaging)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Byte-compile every script
        run: python3 -m compileall -q tools tests
      - name: Test generated-code bundle and artifact contents
        run: python3 -I tests/ci_tools_test.py
